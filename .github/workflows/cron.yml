name: Scheduled cron calls

# GitHub Actions is Work Hub's external scheduler (not Vercel's own cron,
# to stay on free tiers — see docs/superpowers/plans/2026-10-13-work-hub-mvp.md
# Global Constraints). This workflow calls the two protected `/api/cron/*`
# endpoints on the schedule the plan pins: poll-frameio every 5 minutes
# (within the plan's required 2-5 minute range — see I2's note below on why
# this isn't 3), fetch-calendar every 15 minutes. Both endpoints are gated
# by `checkCronSecret` (lib/auth/cron-secret.ts), which checks an
# `Authorization: Bearer <token>` header against the deployed `CRON_SECRET`
# env var — so both jobs below send that same secret, read from this repo's
# `CRON_SECRET` Actions secret, which must be set to the exact same value
# as the Vercel `CRON_SECRET` env var (see docs/superpowers/deploy-notes.md).
#
# Why */5 and not */3: GitHub documents 5 minutes as the shortest
# reliably-supported schedule interval — */3 doesn't actually buy anything
# over */5 in practice. */3 would also run ~17,000 billed minutes/month,
# well past GitHub's free-tier allowance of 2,000 minutes/month for a
# PRIVATE repo (this repo must be public for the free Actions minutes to be
# sufficient — see docs/superpowers/deploy-notes.md §6 — nothing secret is
# committed here, every secret is an env var/Actions secret).
#
# GitHub's two `schedule` triggers below fire on independent clocks but
# always deliver the same workflow run with `github.event.schedule` set to
# whichever cron expression fired it. Each job's `if:` only runs the job
# that matches that expression, so a given run calls exactly one endpoint
# — except `workflow_dispatch`, which runs both jobs, for manually
# verifying the whole workflow without waiting on the clock.
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  poll-frameio:
    name: Poll Frame.io
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/poll-frameio
        run: |
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/poll-frameio"

  fetch-calendar:
    name: Fetch Google Calendar
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/fetch-calendar
        run: |
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/fetch-calendar"
